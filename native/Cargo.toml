[package]
name = "rtl-spectrum-studio"
version = "0.2.2"
edition = "2024"
publish = false
default-run = "rtl-spectrum-studio"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
ctrlc = "3.4"
hound = "3.5"
libloading = "0.8"
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
